<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo Python - PyScript</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #f4f4f4;
    }

    /* Área geral do jogo */
    .container {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px;

      /* Cria colunas automaticamente quando houver espaço */
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
      gap: 20px;
      align-items: start;
    }

    /* Coluna esquerda: título + mídias */
    .painel-jogo {
      min-width: 0;
    }

    .cabecalho {
      text-align: center;
      margin-bottom: 20px;
    }

    .cabecalho h1 {
      margin-top: 0;
    }

    .midia,
    .terminal {
      background: #1d1d1d;
      border-radius: 16px;
      padding: 16px;
    }

    .terminal {
      min-width: 0;
      overflow: auto;
    }

    #imagem-cena {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      border-radius: 12px;
      display: none;
      margin-bottom: 12px;
    }

    #video-intro {
      width: 100%;
      max-height: 460px;
      border-radius: 12px;
      display: none;
      margin-bottom: 12px;
    }

    #audio-fundo {
      width: 100%;
      margin-top: 8px;
    }

    .aviso {
      font-size: .95rem;
      opacity: .8;
      margin-top: 8px;
    }

    /* Celular/tablet em modo vertical: tudo cabe em uma única tela */
    @media (max-width: 800px) and (orientation: portrait) {
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden; /* impede rolagem da página */
      }

      body {
        height: 100dvh; /* considera corretamente a barra do navegador móvel */
      }

      .container {
        height: 100dvh;
        max-height: 100dvh;
        padding: 8px;
        gap: 8px;

        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        overflow: hidden;
      }

      .painel-jogo {
        min-height: 0;
      }

      .cabecalho {
        margin-bottom: 6px;
      }

      .cabecalho h1 {
        margin: 0;
        font-size: clamp(1.1rem, 5vw, 1.45rem);
        line-height: 1.1;
      }

      .cabecalho p {
        margin: 3px 0 0;
        font-size: .78rem;
      }

      .midia,
      .terminal {
        border-radius: 10px;
        padding: 8px;
      }

      .midia {
        max-height: 31dvh;
        overflow: hidden;
      }

      #imagem-cena,
      #video-intro {
        width: 100%;
        max-height: 20dvh;
        object-fit: contain;
        margin-bottom: 4px;
        border-radius: 8px;
      }

      #audio-fundo {
        width: 100%;
        height: 32px;
        margin-top: 2px;
      }

      .aviso {
        display: none; /* economiza espaço durante o jogo */
      }

      .terminal {
        height: 100%;
        min-height: 0;
        overflow: auto; /* somente o terminal pode rolar */
        overscroll-behavior: contain;
      }
    }

    /* Celular/tablet horizontal continua responsivo em uma coluna compacta */
    @media (max-width: 800px) and (orientation: landscape) {
      .container {
        padding: 10px;
        gap: 10px;
      }

      .cabecalho {
        margin-bottom: 8px;
      }

      .cabecalho h1 {
        font-size: 1.35rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Lado esquerdo: título + mídias -->
    <section class="painel-jogo">
      <div class="cabecalho">
        <h1 id="titulo-jogo">🎮 Meu Jogo Python</h1>
        <p id="autor-jogo">Autor: Nome do aluno</p>
      </div>

      <div class="midia">
        <img id="imagem-cena" alt="Imagem da cena">

        <video id="video-intro" controls>
          Seu navegador não suporta vídeo.
        </video>

        <audio id="audio-fundo" controls loop>
          Seu navegador não suporta áudio.
        </audio>

        <p class="aviso">
          As mídias são opcionais. Se não forem usadas, o jogo continua funcionando.
        </p>
      </div>
    </section>

    <!-- Lado direito: terminal do jogo -->
    <section class="terminal">
      <script type="py" src="./jogo.py" terminal worker></script>
    </section>

  </div>
</body>
</html>
