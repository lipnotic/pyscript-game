<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ALVORECER DOS DEUSES</title>


    <!-- =====================================================
         PYSCRIPT
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://pyscript.net/releases/2026.3.1/core.css"
    >

    <script
        type="module"
        src="https://pyscript.net/releases/2026.3.1/core.js">
    </script>


    <style>

        /* =====================================================
           CONFIGURAÇÕES GERAIS
           ===================================================== */

        * {

            box-sizing: border-box;

        }


        html,
        body {

            margin: 0;

            padding: 0;

            min-height: 100%;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #090909,
                    #151515
                );

            color: #f4f4f4;

        }


        /* =====================================================
           CONTAINER PRINCIPAL
           ===================================================== */

        .container {

            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

            padding: 24px;

        }


        /* =====================================================
           CABEÇALHO
           ===================================================== */

        .cabecalho {

            text-align: center;

            margin-bottom: 24px;

        }


        .cabecalho h1 {

            margin:

                0
                0
                8px
                0;

            font-size:

                clamp(
                    30px,
                    5vw,
                    54px
                );

            letter-spacing: 2px;

        }


        .cabecalho p {

            margin: 0;

            opacity: 0.75;

            font-size: 17px;

        }


        /* =====================================================
           ÁREA DE MÍDIA
           ===================================================== */

        .midia {

            background: #1a1a1a;

            border-radius: 18px;

            padding: 18px;

            margin-bottom: 20px;

            box-shadow:

                0
                10px
                30px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

        }


        /* =====================================================
           IMAGEM DA CENA
           ===================================================== */

        #imagem-cena {

            display: none;

            width: 100%;

            max-height: 500px;

            object-fit: cover;

            border-radius: 14px;

            margin-bottom: 15px;

        }


        /* =====================================================
           VÍDEO
           ===================================================== */

        #video-intro {

            display: none;

            width: 100%;

            max-height: 500px;

            border-radius: 14px;

            margin-bottom: 15px;

            background: #000;

        }


        /* =====================================================
           ÁUDIO
           ===================================================== */

        #audio-fundo {

            width: 100%;

            margin-top: 5px;

        }


        .controle-audio {

            margin-top: 10px;

            text-align: center;

            font-size: 13px;

            opacity: 0.65;

        }


        /* =====================================================
           TERMINAL
           ===================================================== */

        .terminal {

            background: #171717;

            border-radius: 18px;

            padding: 20px;

            min-height: 250px;

            overflow: hidden;

            box-shadow:

                0
                10px
                30px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

        }


        /* =====================================================
           TELA INICIAL
           ===================================================== */

        #tela-inicio {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:

                radial-gradient(
                    circle at center,
                    #252525 0%,
                    #101010 50%,
                    #050505 100%
                );

        }


        /* =====================================================
           PAINEL DE ABERTURA
           ===================================================== */

        .painel-inicio {

            width: 100%;

            max-width: 760px;

            text-align: center;

            padding:

                45px
                30px;

            border-radius: 24px;

            background:

                rgba(
                    20,
                    20,
                    20,
                    0.88
                );

            border:

                1px
                solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            box-shadow:

                0
                20px
                60px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

        }


        .icone-jogo {

            font-size: 70px;

            margin-bottom: 20px;

        }


        .painel-inicio h1 {

            margin:

                0
                0
                15px
                0;

            font-size:

                clamp(
                    36px,
                    7vw,
                    68px
                );

            line-height: 1;

            letter-spacing: 3px;

        }


        .subtitulo {

            font-size: 21px;

            opacity: 0.82;

            margin-bottom: 12px;

        }


        .autor {

            font-size: 16px;

            opacity: 0.58;

            margin-bottom: 35px;

        }


        /* =====================================================
           BOTÃO INICIAR
           ===================================================== */

        #botao-iniciar {

            border: none;

            border-radius: 16px;

            padding:

                22px
                48px;

            font-size: 24px;

            font-weight: bold;

            cursor: pointer;

            transition:

                transform
                0.2s,

                box-shadow
                0.2s;

        }


        #botao-iniciar:hover {

            transform:

                translateY(-2px)
                scale(1.03);

            box-shadow:

                0
                10px
                30px
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

        }


        #botao-iniciar:active {

            transform:

                scale(
                    0.98
                );

        }


        .dica {

            margin-top: 22px;

            font-size: 14px;

            opacity: 0.55;

        }


        /* =====================================================
           RESPONSIVIDADE
           ===================================================== */

        @media
        (
            max-width: 700px
        ) {

            .container {

                padding: 12px;

            }


            .painel-inicio {

                padding:

                    35px
                    20px;

            }


            .icone-jogo {

                font-size: 52px;

            }


            #botao-iniciar {

                width: 100%;

                padding:

                    19px
                    20px;

                font-size: 21px;

            }


            .midia,
            .terminal {

                border-radius: 12px;

                padding: 12px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     TELA DE ABERTURA
     ========================================================= -->

<div id="tela-inicio">


    <div class="painel-inicio">


        <div class="icone-jogo">

            ⚔️

        </div>


        <h1>

            ALVORECER<br>
            DOS DEUSES

        </h1>


        <div class="subtitulo">

            Uma aventura mitológica interativa

        </div>


        <div class="autor">

            Criado por Felipe Garbin

        </div>


        <button
            id="botao-iniciar"
            type="button"
        >

            ▶ INICIAR JOGO

        </button>


        <div class="dica">

            Clique para iniciar a aventura e habilitar a trilha sonora.

        </div>


    </div>


</div>



<!-- =========================================================
     CONTEÚDO DO JOGO
     ========================================================= -->

<div class="container">


    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="cabecalho">


        <h1 id="titulo-jogo">

            ALVORECER DOS DEUSES

        </h1>


        <p id="autor-jogo">

            Autor: Felipe Garbin

        </p>


    </header>



    <!-- =====================================================
         ÁREA DE MÍDIA
         ===================================================== -->

    <section class="midia">


        <!-- IMAGEM ALTERADA PELO PYTHON -->

        <img
            id="imagem-cena"
            src=""
            alt="Imagem da cena atual"
        >



        <!-- VÍDEO CONTROLADO PELO PYTHON -->

        <video
            id="video-intro"
            controls
            preload="metadata"
        >

            Seu navegador não suporta reprodução de vídeo.

        </video>



        <!-- ÁUDIO -->

        <audio
            id="audio-fundo"
            controls
            loop
            preload="auto"
        >

            Seu navegador não suporta reprodução de áudio.

        </audio>


        <div class="controle-audio">

            🔊 Você pode alterar o volume ou pausar a trilha sonora.

        </div>


    </section>



    <!-- =====================================================
         TERMINAL PYSCRIPT
         ===================================================== -->

    <section class="terminal">


        <script
            type="py"
            src="./jogo.py"
            terminal
            worker>
        </script>


    </section>


</div>



<!-- =========================================================
     JAVASCRIPT DA PÁGINA
     ========================================================= -->

<script>


    /*
    ==========================================================
    ELEMENTOS
    ==========================================================
    */


    const telaInicio =
        document.getElementById(
            "tela-inicio"
        );


    const botaoIniciar =
        document.getElementById(
            "botao-iniciar"
        );


    const audio =
        document.getElementById(
            "audio-fundo"
        );



    /*
    ==========================================================
    CONFIGURAÇÃO DA TRILHA
    ==========================================================
    */


    const trilhaInicial =

        "assets/The Dawn of Aethelgard.mp3";



    /*
    ==========================================================
    EVENTO DO BOTÃO INICIAR
    ==========================================================
    */


    botaoIniciar.addEventListener(

        "click",

        async function () {


            /*
            ----------------------------------------------
            Define a trilha sonora
            ----------------------------------------------
            */


            audio.src =
                trilhaInicial;


            /*
            ----------------------------------------------
            Repete a música automaticamente
            ----------------------------------------------
            */


            audio.loop =
                true;


            /*
            ----------------------------------------------
            Volume inicial

            0.0 = mudo
            0.5 = 50%
            1.0 = máximo
            ----------------------------------------------
            */


            audio.volume =
                0.5;



            /*
            ----------------------------------------------
            Tenta iniciar o áudio.

            Agora o navegador permite,
            pois houve um clique real do usuário.
            ----------------------------------------------
            */


            try {


                await audio.play();


            }
            catch (erro) {


                /*
                Se mesmo assim o navegador bloquear,
                não interrompemos o jogo.

                O usuário ainda pode clicar manualmente
                no controle Play do áudio.
                */


                console.log(

                    "Não foi possível iniciar automaticamente a trilha.",

                    erro

                );


            }



            /*
            ----------------------------------------------
            Esconde a tela inicial
            ----------------------------------------------
            */


            telaInicio.style.display =
                "none";


        }

    );


</script>


</body>

</html>
