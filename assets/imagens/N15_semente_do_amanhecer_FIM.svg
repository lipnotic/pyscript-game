<title>Yara planta uma semente enquanto luzes distantes despertam lentamente no horizonte</title>
<desc>Uma figura solitária ajoelhada plantando uma pequena semente brilhante em terra escura, com pequenos pontos de luz dourada surgindo ao longe no horizonte sob um céu de transição entre noite e amanhecer.</desc>
